name: Alexa widget (pruebas sin credenciales)
on:
  pull_request:
    paths:
      - "server/alexaWidget.js"
      - "alexa/**"
      - "tests/alexa-widget.test.js"
      - "api/index.js"
      - ".github/workflows/alexa-widget-check.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar documentos APL
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const file of ['alexa/widget.json', 'alexa/widget-show5.json', 'alexa/test-datastore.json']) { const value=JSON.parse(fs.readFileSync(file,'utf8')); if(file.includes('widget') && !file.includes('datastore') && value.type!=='APL') throw new Error(file+' no es un APL importable'); console.log('OK',file) }"
      - name: Probar lectura protegida y formato energético
        run: node tests/alexa-widget.test.js
